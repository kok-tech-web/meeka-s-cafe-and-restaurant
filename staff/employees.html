<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employees — MEEKA's Staff</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
    .staff-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1a1a1a; display: flex; flex-direction: column; padding: 20px 0; position: fixed; top: 0; left: 0; height: 100vh; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid #2a2a2a; margin-bottom: 16px; }
    .sidebar-brand .logo-circle { width: 32px; height: 32px; font-size: 15px; background: #E87722; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
    .sidebar-brand .logo-name { font-size: 13px; font-weight: 600; color: #fff; }
    .sidebar-brand .logo-sub { font-size: 9px; color: #E87722; letter-spacing: 0.08em; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 13px; color: #888; text-decoration: none; transition: all 0.2s; }
    .nav-item:hover { background: #242424; color: #fff; }
    .nav-item.active { background: #242424; color: #E87722; border-left: 3px solid #E87722; }
    .nav-item i { font-size: 18px; }
    .sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid #2a2a2a; }
    .logout-btn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; cursor: pointer; background: none; border: none; font-family: 'Segoe UI', sans-serif; }
    .logout-btn:hover { color: #ff6666; }
    .main-content { margin-left: 220px; flex: 1; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .topbar-title { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .topbar-user { font-size: 13px; color: #888; display: flex; align-items: center; gap: 8px; }
    .topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff3e6; color: #E87722; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
    .dash-section { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .dash-section-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .dash-section-title i { color: #E87722; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #eee; text-align: left; }
    .data-table td { font-size: 13px; color: #1a1a1a; padding: 10px 12px; border-bottom: 1px solid #f5f5f5; }
    .data-table tr:last-child td { border-bottom: none; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .badge-active { background: #e6f4ea; color: #2d7a3a; }
    .badge-inactive { background: #f5f5f5; color: #888; }
    .empty-state { text-align: center; padding: 32px; color: #aaa; font-size: 13px; }
    .btn-primary { background: #E87722; color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: 'Segoe UI', sans-serif; }
    .btn-primary:hover { background: #cf6510; }
    .emp-avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff3e6; color: #E87722; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px; width: 420px; max-width: 90%; }
    .modal-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
    .form-input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; color: #1a1a1a; outline: none; font-family: 'Segoe UI', sans-serif; }
    .form-input:focus { border-color: #E87722; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-secondary { background: #f5f5f5; color: #888; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
  </style>
</head>
<body>

<div class="staff-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-circle">M</div>
      <div>
        <div class="logo-name">MEEKA's</div>
        <div class="logo-sub">STAFF PANEL</div>
      </div>
    </div>
    <a href="dashboard.html" class="nav-item"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a href="employees.html" class="nav-item active"><i class="ti ti-users"></i> Employees</a>
    <a href="attendance.html" class="nav-item"><i class="ti ti-clock"></i> Attendance</a>
    <a href="tasks.html" class="nav-item"><i class="ti ti-checklist"></i> Tasks</a>
    <a href="applications.html" class="nav-item"><i class="ti ti-mail"></i> Applications</a>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Employees</div>
      <div class="topbar-user">
        <div class="topbar-avatar" id="avatarInitial">M</div>
        <span id="managerName">Manager</span>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title" style="justify-content: space-between;">
        <span><i class="ti ti-users"></i> All employees</span>
        <button class="btn-primary" onclick="openModal()">
          <i class="ti ti-plus"></i> Add employee
        </button>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Role</th>
            <th>Shift</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="employeesTable">
          <tr><td colspan="5" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ADD EMPLOYEE MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">Add new employee</div>
    <div class="form-group">
      <label class="form-label">Full name</label>
      <input type="text" class="form-input" id="empName" placeholder="e.g. Aron Tesfaye" />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="empEmail" placeholder="aron@meekas.et" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="empPassword" placeholder="Set a password" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="empRole">
          <option value="">Select role...</option>
          <option>Waiter</option>
          <option>Waitress</option>
          <option>Chef</option>
          <option>Cashier</option>
          <option>Cleaner</option>
          <option>Kitchen assistant</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Shift</label>
        <select class="form-input" id="empShift">
          <option value="">Select shift...</option>
          <option>Morning shift</option>
          <option>Evening shift</option>
          <option>Full day</option>
        </select>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addEmployee()"><i class="ti ti-check"></i> Add employee</button>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('meeka_staff_logged_in') !== 'true') window.location.href = 'login.html';
  const name = localStorage.getItem('meeka_staff_name') || 'Manager';
  document.getElementById('managerName').textContent = name;
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();
  function logout() { localStorage.clear(); window.location.href = 'login.html'; }
  function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  async function loadEmployees() {
    const res = await fetch('http://localhost:3000/employees');
    const data = await res.json();
    const tbody = document.getElementById('employeesTable');
    if (!data.success || data.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No employees yet — add one above</td></tr>';
      return;
    }
    tbody.innerHTML = data.data.map(e => `
      <tr>
        <td style="display:flex; align-items:center; gap:10px;">
          <div class="emp-avatar">${e.name.charAt(0)}</div>
          <span>${e.name}</span>
        </td>
        <td>${e.role}</td>
        <td>${e.shift}</td>
        <td>${e.email}</td>
        <td><span class="badge badge-${e.status}">${e.status}</span></td>
      </tr>
    `).join('');
  }

  async function addEmployee() {
    const name = document.getElementById('empName').value;
    const email = document.getElementById('empEmail').value;
    const password = document.getElementById('empPassword').value;
    const role = document.getElementById('empRole').value;
    const shift = document.getElementById('empShift').value;

    const res = await fetch('http://localhost:3000/employees', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role, shift })
    });
    const data = await res.json();
    if (data.success) {
      closeModal();
      loadEmployees();
    } else {
      alert(data.message);
    }
  }

  loadEmployees();
</script>

</body>
</html>
